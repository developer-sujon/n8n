name: Deploy n8n Production to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-n8n-ec2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME || 'n8n.yupsis.com' }}
          N8N_ADMIN_EMAIL: ${{ secrets.N8N_ADMIN_EMAIL }}
          N8N_ADMIN_PASSWORD: ${{ secrets.N8N_ADMIN_PASSWORD }}
          N8N_ENCRYPTION_KEY: ${{ secrets.N8N_ENCRYPTION_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: GH_TOKEN,REPO,DOMAIN_NAME,N8N_ADMIN_EMAIL,N8N_ADMIN_PASSWORD,N8N_ENCRYPTION_KEY,POSTGRES_PASSWORD,REDIS_PASSWORD,ENV_FILE
          script_stop: true
          script: |
            echo "Starting n8n deployment on AWS EC2..."

            REPO_DIR="$HOME/n8n-server"
            AUTH_URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

            if [ ! -d "$REPO_DIR/.git" ]; then
              rm -rf "$REPO_DIR"
              git clone "$AUTH_URL" "$REPO_DIR"
            fi

            cd "$REPO_DIR"
            git remote set-url origin "$AUTH_URL"
            git fetch origin main
            git reset --hard origin/main

            if ! command -v docker &> /dev/null; then
              chmod +x setup-server.sh
              bash setup-server.sh
            fi

            # Construct .env from individual GitHub secrets if provided
            if [ -n "$POSTGRES_PASSWORD" ] && [ -n "$N8N_ENCRYPTION_KEY" ]; then
              cat << EOF > .env
            DOMAIN_NAME=${DOMAIN_NAME}
            N8N_ADMIN_EMAIL=${N8N_ADMIN_EMAIL}
            N8N_ADMIN_PASSWORD=${N8N_ADMIN_PASSWORD}
            N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            REDIS_PASSWORD=${REDIS_PASSWORD}
            EOF
              sed -i 's/^[ \t]*//' .env
              echo "Configured .env from individual GitHub Secrets."
            elif [ -n "$ENV_FILE" ]; then
              echo "$ENV_FILE" > .env
              echo "Configured .env from ENV_FILE secret."
            elif [ ! -f .env ]; then
              cp .env.example .env
            fi

            chmod +x deploy.sh scale.sh backup.sh
            bash deploy.sh

            echo "n8n deployed successfully!"
