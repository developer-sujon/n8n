upstream n8n_main_upstream {
    server n8n-main:5678 max_fails=3 fail_timeout=5s;
    keepalive 32;
}

upstream n8n_webhook_upstream {
    server n8n-webhook:5678 max_fails=3 fail_timeout=5s;
    server n8n-main:5678 backup;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME Challenge for Let's Encrypt certificates
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Proxy all traffic to n8n
    location / {
        # Check if forwarded proto is http, can redirect if using SSL
        # if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }

        proxy_pass http://n8n_main_upstream;
        proxy_http_version 1.1;

        # WebSockets support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts and Buffers
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 100M;

        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # Dedicated high-throughput webhook handling
    location ~ ^/(webhook|webhook-test)/ {
        proxy_pass http://n8n_webhook_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        client_max_body_size 100M;
    }

    # Public Health Probe Endpoint for load balancers
    location /health {
        access_log off;
        proxy_pass http://n8n_main_upstream/healthz;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }
}
